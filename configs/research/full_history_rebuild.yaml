      - {learning_rate: 0.02, depth: 3, iterations: 400, l2_leaf_reg: 15.0}
      - {learning_rate: 0.03, depth: 4, iterations: 300, l2_leaf_reg: 20.0}
    additive:
      - {decay: 0.995, coefficient_bound: 0.35}
      - {decay: 0.990, coefficient_bound: 0.25}
